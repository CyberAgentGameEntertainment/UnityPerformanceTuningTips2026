name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PDFと同じDockerイメージ（Ruby・pandoc・Node.jsのバージョンを固定）でWeb版をビルドし、
      # Markdown→Re:VIEW変換の結果をPDFと揃える。
      - name: Build Docker image
        run: docker build -t review-custom:5.11 .

      - name: Build web pages (all languages)
        run: |
          docker run --rm --volume "${GITHUB_WORKSPACE}:/book" --workdir /book \
            --env BUNDLE_FROZEN=true review-custom:5.11 \
            sh -c 'set -e; bundle install --quiet; npm ci --ignore-scripts; npm run web'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: articles/webroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
