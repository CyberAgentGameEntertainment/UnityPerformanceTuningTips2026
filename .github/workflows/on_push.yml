name: Build Re:VIEW to make distribution file
# mainへのpushで、5言語の電子書籍版PDFをビルドしてArtifactに保存します。
# Actions画面から手動実行（workflow_dispatch）すると、ビルド後にリリースを作成してPDFを添付し、
# 続けてWeb版をGitHub Pagesへデプロイします。Web版はリリースと同じ内容にそろえるため、
# pushではデプロイしません。手動実行で target に web を選ぶと、PDFのビルドとリリースを省いて
# Web版だけをデプロイします。
# 組版は scripts/build-review-pdf.py がDockerイメージ（review-custom:5.11）の中で行います。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'release: PDFをビルドしてリリースを作成し、Web版もデプロイする / web: Web版だけをデプロイする'
        required: true
        default: release
        type: choice
        options:
          - release
          - web
      tag:
        description: 'リリースのタグ（例: v1.0.0）。target が release のときに必須。既に存在するタグや、削除したリリースのタグは指定できません'
        required: false
        type: string
      notes:
        description: 'リリースノート（省略時は空）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # 手動リリースがmainへのpushで中断されないよう、イベントごとにグループを分ける
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build e-book PDF (${{ matrix.asset }})
    if: github.event_name == 'push' || inputs.target == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - lang: jp
            asset: ja
          - lang: en_2026
            asset: en
          - lang: ko_2026
            asset: ko
          - lang: zh-hans_2026
            asset: zh-Hans
          - lang: zh-hant_2026
            asset: zh-Hant
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build distribution file
        run: ./build-in-docker-epub.sh
        env:
          REVIEW_LANG: ${{ matrix.lang }}
          OUTPUT_PDF: output/pdf/UnityPerformanceTuningTips2026-${{ matrix.asset }}.pdf

      - name: Upload distribution file to GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.asset }}
          path: ./output/pdf/UnityPerformanceTuningTips2026-${{ matrix.asset }}.pdf
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: pdf
          merge-multiple: true

      - name: Create release with PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::target が release のときは tag を指定してください"
            exit 1
          fi
          # gh release create は既存のタグを付け替えないため、別のコミットを指すタグに
          # 今回のPDFが添付されるのを防ぐ目的で、既存のタグは拒否する
          if gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref' | grep -qx "refs/tags/$TAG"; then
            echo "::error::タグ $TAG は既に存在します。新しいタグを指定してください"
            exit 1
          fi
          ls -l pdf
          gh release create "$TAG" pdf/*.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES"

  build-web:
    name: Build web
    needs: release
    # target が web のときは release がスキップされるため、!cancelled() で前段の結果を自分で判定する
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'web' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    # actions/configure-pages がPagesの設定を読むため、pagesの権限が必要
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PDFと同じDockerイメージ（Ruby・pandoc・Node.jsのバージョンを固定）でWeb版をビルドし、
      # Markdown→Re:VIEW変換の結果をPDFと揃える。
      - name: Build Docker image
        run: docker build -t review-custom:5.11 .

      - name: Build web pages (all languages)
        run: |
          docker run --rm --volume "${GITHUB_WORKSPACE}:/book" --workdir /book \
            --env BUNDLE_FROZEN=true review-custom:5.11 \
            sh -c 'set -e; bundle install --quiet; npm ci --ignore-scripts; npm run web'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: articles/webroot

  deploy-web:
    name: Deploy web
    needs: build-web
    # 祖先の release がスキップされても動くよう、build-web の結果だけで判定する
    if: "!cancelled() && needs.build-web.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
